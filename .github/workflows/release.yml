# Releasing is one step: add a dated version section to CHANGELOG.md, such as "## [0.3.0] - 2026-11-01", and push
# to main. This workflow sees a version with no tag yet, runs the tests, tags it v0.3.0, and tools/release.sh zips
# LeanPad/ and uploads it to GitHub Releases and CurseForge (project ID in the TOC). Pushing a v* tag by hand
# releases that tag the same way, and Run workflow on GitHub re-releases the newest changelog version.
# Needs the CF_API_KEY repository secret.
name: Release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ["v*"]
  workflow_dispatch:

concurrency: release

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          else
            # The newest released version is the first "## [x.y.z]" heading; [Unreleased] is skipped.
            version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)
            if [ -z "$version" ]; then
              release=false
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              release=true # a manual run re-releases the newest version, tagged or not
            elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              release=false
            else
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t leanpad-test spec
      - run: docker run --rm -v "$PWD:/src" leanpad-test

  release:
    needs: [plan, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag pushed with GITHUB_TOKEN starts no new run, so tagging here never releases twice.
      - name: Tag, package and upload
        run: |
          cp tools/release.sh "$RUNNER_TEMP/release.sh" # the tagged commit may predate the script
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          git checkout -q "v$VERSION" # package exactly the tagged commit
          bash "$RUNNER_TEMP/release.sh" "$VERSION"
